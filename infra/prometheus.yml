# Prometheus (documento 9.5): recolecta las metricas del API Gateway y del
# Live Score Service cada 15 segundos.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: live-score-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['live-score-service:3005']
