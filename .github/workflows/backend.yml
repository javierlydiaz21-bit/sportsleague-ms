# Pipeline CI/CD del backend (documento, seccion 7.1)
#   1. Trigger en push / pull request      5. Build de la imagen Docker
#   2. Instalacion de dependencias         6. Push al registry (GHCR)
#   3. Lint                                7. Deploy a Render (rolling update)
#   4. Tests
# En pull requests solo se ejecutan los pasos 2 a 5 (sin publicar ni desplegar).
# El deploy a produccion ocurre solo con push a main.
name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths: ["*-service/**", "api-gateway/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["*-service/**", "api-gateway/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  service:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: team-service
            deploy_hook: RENDER_DEPLOY_HOOK_TEAM
          - service: league-service
            deploy_hook: RENDER_DEPLOY_HOOK_LEAGUE
          - service: fixture-service
            deploy_hook: RENDER_DEPLOY_HOOK_FIXTURE
          - service: referee-service
            deploy_hook: RENDER_DEPLOY_HOOK_REFEREE
          - service: live-score-service
            deploy_hook: RENDER_DEPLOY_HOOK_LIVE_SCORE
          - service: statistics-service
            deploy_hook: RENDER_DEPLOY_HOOK_STATISTICS
          - service: notification-service
            deploy_hook: RENDER_DEPLOY_HOOK_NOTIFICATION
          - service: analytics-service
            deploy_hook: RENDER_DEPLOY_HOOK_ANALYTICS
          - service: api-gateway
            deploy_hook: RENDER_DEPLOY_HOOK_GATEWAY
    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (Jest)
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Nombre de la imagen
        id: image
        # GHCR exige minusculas en el nombre del propietario
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sportsleague-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Deploy a Render
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_HOOK: ${{ secrets[matrix.deploy_hook] }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::Falta el secret ${{ matrix.deploy_hook }}; se omite el deploy de ${{ matrix.service }}."
            exit 0
          fi
          # Render descarga esta imagen exacta (por commit) y reemplaza la instancia
          # solo cuando la nueva responde en su health check.
          IMG_ENCODED=$(jq -rn --arg v "$IMAGE" '$v|@uri')
          curl -fsS -X POST "${DEPLOY_HOOK}&imgURL=${IMG_ENCODED}" > /dev/null
          echo "Deploy solicitado a Render: $IMAGE"
