# CI del frontend (Next.js). El despliegue lo hace Vercel por su integracion con GitHub
# (documento, seccion 8.1): produccion con cada cambio en main y un preview por cada pull request.
name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build
