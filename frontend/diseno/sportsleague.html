<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SportsLeague</title>
<!--
  SPORTSLEAGUE: toda la plataforma en una sola página (registro, inicio y las 7 secciones).
  Rutas internas: #/registro, #/entrar, #/inicio, #/ligas, #/equipos, #/arbitros, #/calendario,
                  #/partidos(/id), #/estadisticas, #/publico(/calendario | /tabla | /partido/id)
  Bloques del archivo:
    1. Estilos: sistema visual "liga oficial" (variables de color y tipografía en :root).
    2. Datos: una colección por cada tabla del documento de arquitectura y las reglas de negocio
       (elegibilidad, calendario, asignación de árbitros, tabla de posiciones). Aquí se conectan los endpoints reales.
    3. Aplicación: enrutador, íconos de sección, piezas de interfaz y una vista por sección (cada una indica su microservicio).
  Datos de ejemplo ficticios; se guardan en el navegador (localStorage).
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet" />
<style>
/* ===== SportsLeague: estilo "liga oficial" ===== */
:root {
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --ink: #0E1630;          /* azul tinta: encabezados y texto */
  --ink-2: #39425A;
  --muted: #6A7287;
  --line: #E4E7ED;
  --line-2: #D2D7E0;
  --navy: #0E1630;
  --on-navy: #EEF1F7;
  --on-navy-muted: #A3ABC2;
  --green: #0E7A55;        /* verde cancha: acciones y estados positivos */
  --green-ink: #0A5C40;
  --green-soft: #E4F2EC;
  --gold: #B58A2E;         /* dorado trofeo: lo destacado */
  --gold-soft: #F5EEDC;
  --amber: #D99A12;
  --amber-soft: #FBF0D6;
  --red: #C2323B;
  --red-soft: #FAE6E7;
  --font: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* Diseño claro a propósito; respeta las zonas seguras de los celulares */
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; }
body { font: 400 15.5px/1.6 var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font); font-stretch: 72%; font-weight: 700; letter-spacing: -.005em; line-height: 1.04; margin: 0; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
.scroll { overflow-x: auto; }
.empty { color: var(--muted); padding: 8px 0; }
.num-font { font-stretch: 75%; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 .94rem var(--font); padding: 10px 18px;
       border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer;
       white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--ink-2); }
.btn-blue { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn-blue:hover { background: #1C2747; border-color: #1C2747; }
.btn-yellow { background: var(--green); border-color: var(--green); color: #fff; }
.btn-yellow:hover { background: var(--green-ink); border-color: var(--green-ink); }
.btn-sm { padding: 6px 12px; font-size: .86rem; border-radius: 8px; }
.btn-block { width: 100%; padding: 12px 18px; }
.linkish { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--green); cursor: pointer; text-decoration: underline; text-decoration-color: rgba(14, 122, 85, .35); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: currentColor; }

/* ---------- Escudos y estados ---------- */
.crest { width: var(--s, 32px); height: var(--s, 32px); flex: none; border-radius: 50%; display: inline-grid; place-items: center;
         font: 700 calc(var(--s, 32px) * .34) / 1 var(--font); font-stretch: 75%; letter-spacing: .02em; color: var(--c2); background: var(--c1);
         box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .28), 0 0 0 1px rgba(14, 22, 48, .08); }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 .76rem/1 var(--font); padding: 5px 9px; border-radius: 999px; white-space: nowrap; background: #EDEFF3; color: var(--ink-2); }
.chip-en_curso { background: var(--amber-soft); color: #7A5306; }
.chip-en_curso i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 1.4s infinite; }
.chip-finalizado { background: #E6E9F0; color: var(--ink); }
.chip-suspendido { background: var(--red-soft); color: #8F1F27; }
@keyframes pulse { 50% { opacity: .3; } }
.elig { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.elig-elegible { background: var(--green-soft); color: var(--green-ink); }
.elig-no_elegible { background: var(--red-soft); color: #8F1F27; }
.elig-pendiente { background: var(--amber-soft); color: #7A5306; }

/* ---------- Íconos ---------- */
.ico { width: 18px; height: 18px; flex: none; display: grid; place-items: center; }
.ico svg, .kit-icon svg, .band-icon svg, .feat svg { width: 100%; height: 100%; display: block; }

/* ---------- Barra superior ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(255, 255, 255, .94); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 22px; min-height: 64px; max-width: 1320px; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 700 1.3rem/1 var(--font); font-stretch: 75%; letter-spacing: .005em; flex: none; }
.logo svg { width: 30px; height: 30px; flex: none; }
.squad { display: flex; gap: 2px; overflow-x: auto; flex: 1; align-self: stretch; scrollbar-width: none; }
.squad a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 500; font-size: .9rem; color: var(--muted); padding: 0 11px;
           border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.squad a:hover { color: var(--ink); }
.squad a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--green); font-weight: 600; }
.squad a[aria-current="page"] .ico { color: var(--green); }
.menu { position: relative; flex: none; }
.menu summary { list-style: none; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; background: var(--navy); color: #fff;
                display: grid; place-items: center; font: 700 .82rem/1 var(--font); letter-spacing: .03em; }
.menu summary::-webkit-details-marker { display: none; }
.menu-panel { position: absolute; right: 0; top: 46px; width: 260px; background: #fff; border: 1px solid var(--line); border-radius: 14px;
              box-shadow: 0 18px 40px -18px rgba(14, 22, 48, .35); padding: 6px; display: grid; }
.menu-panel p { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; font-size: .86rem; color: var(--muted); }
.menu-panel p b { display: block; font-size: .98rem; color: var(--ink); }
.menu-panel a, .menu-panel button { text-align: left; text-decoration: none; padding: 9px 12px; border-radius: 8px; border: 0; background: none; font: 500 .92rem var(--font); color: var(--ink); cursor: pointer; }
.menu-panel a:hover, .menu-panel button:hover { background: var(--bg); }

/* ---------- Bandas en azul tinta con la cancha en trazo fino ---------- */
.pitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; fill: none; stroke: rgba(238, 241, 247, .13); stroke-width: 1.2;
         -webkit-mask-image: linear-gradient(90deg, transparent 15%, #000 70%); mask-image: linear-gradient(90deg, transparent 15%, #000 70%); }
.band, .hello, .pub-head { position: relative; overflow: hidden; background: var(--navy); color: var(--on-navy); }
.band .wrap { position: relative; display: flex; align-items: center; gap: 22px; padding-top: 44px; padding-bottom: 38px; }
.band-icon { width: 56px; height: 56px; flex: none; border-radius: 14px; background: rgba(238, 241, 247, .08); border: 1px solid rgba(238, 241, 247, .16);
             color: #fff; padding: 14px; }
.band h1 { font-size: clamp(2.4rem, 4.6vw, 3.6rem); color: #fff; }
.band p { margin-top: 10px; font-size: 1.04rem; color: var(--on-navy-muted); max-width: 64ch; }

/* ---------- Contenido ---------- */
main.page { padding: 36px 0 96px; }
.stack > * + * { margin-top: 24px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px 28px; }
.card > h2, .head h2 { font-size: 1.7rem; }
.card .hint { color: var(--muted); margin-top: 6px; max-width: 70ch; }
.card > h2 + *, .card > .hint + *, .card > .head + * { margin-top: 18px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 12px 20px; flex-wrap: wrap; }
.head p { color: var(--muted); }
.head a { color: var(--green); font-weight: 600; text-decoration: none; font-size: .92rem; }
.head a:hover { text-decoration: underline; }
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.flash { padding: 13px 16px; border-radius: 12px; background: var(--green-soft); border: 1px solid #BFE0D2; color: var(--green-ink); font-weight: 500; }
.form-msg:empty { display: none; }
.form-msg { margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-weight: 500; font-size: .94rem; }
.form-msg.is-ok { background: var(--green-soft); color: var(--green-ink); }
.form-msg.is-error { background: var(--red-soft); color: #8F1F27; }

/* ---------- Formularios ---------- */
.f { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line); }
.f h3 { font-size: 1.25rem; margin-bottom: 14px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 16px; align-items: end; }
.fl { display: grid; gap: 6px; font-weight: 600; font-size: .86rem; color: var(--ink-2); }
.fl small { font-weight: 400; color: var(--muted); }
input, select { font: 400 .98rem var(--font); padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(14, 122, 85, .16); }
fieldset.checks { border: 0; margin: 0; padding: 0; grid-column: 1 / -1; }
.checks legend { font-weight: 600; font-size: .86rem; color: var(--ink-2); padding: 0; margin-bottom: 8px; }
.checks label { display: inline-flex; align-items: center; gap: 7px; margin: 0 16px 8px 0; font-weight: 400; }
.checks input { width: 16px; height: 16px; accent-color: var(--green); }
.factions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.inline-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inline-form input, .inline-form select { width: auto; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; }
.toolbar .fl select, .head .fl select { min-width: 140px; }

/* ---------- Tablas y listas ---------- */
table.data { width: 100%; border-collapse: collapse; font-size: .95rem; }
.data th { text-align: left; font-weight: 600; font-size: .78rem; letter-spacing: .02em; color: var(--muted); padding: 0 10px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.data td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.data tr:last-child td { border-bottom: 0; }
.data tbody tr:hover td { background: #FAFBFC; }
.data .num { text-align: right; font-variant-numeric: tabular-nums; }
.data .pts { font: 700 1.2rem/1 var(--font); font-stretch: 75%; }
.data .pos { font: 700 1.05rem/1 var(--font); font-stretch: 75%; color: var(--muted); }
.team-cell { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.rule-note { margin-top: 14px; font-size: .86rem; color: var(--muted); }
.rank { list-style: none; margin: 0; padding: 0; }
.rank li { display: grid; grid-template-columns: 22px auto 1fr auto; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.rank li:last-child { border-bottom: 0; }
.rank .n { font: 700 1rem/1 var(--font); font-stretch: 75%; color: var(--muted); }
.rank .who b { display: block; font-weight: 600; }
.rank .who span { font-size: .84rem; color: var(--muted); }
.rank .val { font: 700 1.5rem/1 var(--font); font-stretch: 72%; }
.rank li:first-child .val { color: var(--gold); }
.notes { list-style: none; margin: 0; padding: 0; }
.notes li { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; gap: 3px; }
.notes li:last-child { border-bottom: 0; }
.notes .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.notes .kind { font-weight: 600; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.stat { padding: 20px 26px 22px; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { display: block; font: 700 2.5rem/1 var(--font); font-stretch: 72%; font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 8px; color: var(--muted); font-size: .92rem; }
.trends { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); column-gap: 32px; }
.trend { display: grid; grid-template-columns: auto minmax(0, 1fr) 90px 28px; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-weight: 500; }
.trend em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trend svg { width: 90px; height: 28px; }
.trend b { font: 700 1.15rem/1 var(--font); font-stretch: 75%; text-align: right; }

/* ---------- Partidos ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 14px; }
.tile { display: block; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 15px; transition: border-color .15s; }
.tile:hover { border-color: var(--ink-2); }
.tile-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.tile-min { font: 700 1.1rem/1 var(--font); font-stretch: 75%; color: var(--gold); font-variant-numeric: tabular-nums; }
.tile-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 5px 0; font-weight: 500; }
.tile-row b { font: 700 1.7rem/1 var(--font); font-stretch: 72%; font-variant-numeric: tabular-nums; }
.tile-venue { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: .84rem; color: var(--muted); }
.board { position: relative; overflow: hidden; background: var(--navy); color: var(--on-navy); border-radius: 18px; padding: 20px 26px 28px; }
.board .chip-finalizado { background: rgba(238, 241, 247, .12); color: var(--on-navy); }
.board-top { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--on-navy-muted); font-size: .92rem; }
.board-score { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin-top: 22px; }
.board-side { display: grid; justify-items: center; gap: 12px; text-align: center; font-weight: 600; font-size: 1.02rem; color: #fff; }
.board-digits { font: 700 clamp(3.4rem, 8vw, 5.2rem)/1 var(--font); font-stretch: 70%; color: #fff; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.board-clock { display: block; text-align: center; font: 700 1.3rem/1 var(--font); font-stretch: 75%; color: var(--gold); margin-top: 8px; }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) 76px minmax(0, 1fr) 180px; align-items: center; gap: 12px; padding: 12px 8px; border-bottom: 1px solid var(--line); text-decoration: none; }
a.match-row:hover { background: #FAFBFC; }
.mr-home { display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-weight: 500; text-align: right; }
.mr-away { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.mr-score { text-align: center; font: 700 1.35rem/1 var(--font); font-stretch: 72%; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mr-score.vs { font: 500 .88rem var(--font); color: var(--muted); }
.mr-meta { display: grid; justify-items: end; gap: 4px; font-size: .82rem; color: var(--muted); text-align: right; }
.match-row.compact { grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr); gap: 8px; padding: 10px 2px; }
.match-row.compact .mr-meta { display: none; }
.match-row.compact .mr-score { font-size: 1.15rem; }
.events { list-style: none; margin: 0; padding: 0; }
.events li { display: grid; grid-template-columns: 46px 16px 1fr; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.events li:last-child { border-bottom: 0; }
.events .min { font: 700 1.05rem/1 var(--font); font-stretch: 75%; text-align: right; color: var(--muted); }
.ev { display: inline-block; width: 12px; height: 12px; justify-self: center; }
.ev-gol { border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--ink); }
.ev-amarilla { width: 9px; height: 13px; background: var(--amber); border-radius: 2px; }
.ev-roja { width: 9px; height: 13px; background: var(--red); border-radius: 2px; }
.ev-sustitucion { border-radius: 50%; border: 1.5px dashed var(--muted); }
.round-head { margin-top: 26px; display: flex; align-items: baseline; gap: 12px; }
.round-head h3 { font-size: 1.3rem; }
.round-head p { color: var(--muted); font-size: .92rem; }
.rounds { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 12px; }
.round { flex: 0 0 230px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.round h3 { font-size: 1.15rem; }
.round time { display: block; font-size: .82rem; color: var(--muted); margin: 2px 0 6px; }
.round .m { padding: 8px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.round .m div { display: flex; align-items: center; gap: 6px; font-weight: 500; }
.round .m small { display: block; color: var(--muted); margin-top: 3px; }
.split { display: grid; grid-template-columns: minmax(0, 290px) minmax(0, 1fr); gap: 24px; align-items: start; }
.team-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.team-list button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; font: 500 .96rem var(--font); text-align: left; cursor: pointer; border-radius: 10px; color: var(--ink); }
.team-list button:hover { background: var(--bg); }
.team-list button[aria-current="true"] { background: var(--green-soft); color: var(--green-ink); font-weight: 600; }
.team-list small { margin-left: auto; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.acta-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font: 700 1.6rem/1.1 var(--font); font-stretch: 72%; }

/* =========================================================
   Inicio: índice de secciones
   ========================================================= */
.hello .wrap { position: relative; padding-top: 50px; padding-bottom: 44px; display: flex; justify-content: space-between; align-items: end; gap: 28px; flex-wrap: wrap; }
.hello h1 { font-size: clamp(2.8rem, 6vw, 4.6rem); color: #fff; }
.hello p { margin-top: 12px; font-size: 1.06rem; color: var(--on-navy-muted); max-width: 60ch; }
.progress { min-width: 260px; }
.progress-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.progress-bar span { height: 6px; border-radius: 3px; background: rgba(238, 241, 247, .16); }
.progress-bar span.on { background: var(--gold); }
.progress p { margin-top: 10px; font-size: .92rem; color: var(--on-navy-muted); }
.progress p b { color: #fff; font-weight: 600; }
.squad-title { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.squad-title h2 { font-size: 1.9rem; }
.squad-title p { color: var(--muted); }
.kits { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kit { position: relative; display: flex; flex-direction: column; gap: 4px; text-decoration: none; background: var(--surface); border: 1px solid var(--line);
       border-radius: 16px; padding: 20px 20px 18px; min-height: 196px; transition: border-color .18s, transform .18s; }
.kit:hover { border-color: var(--ink-2); transform: translateY(-2px); }
.kit-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 14px; }
.kit-icon { flex: none; width: 46px; height: 46px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); color: var(--ink); padding: 11px; transition: background .18s, color .18s, border-color .18s; }
.kit:hover .kit-icon { background: var(--navy); border-color: var(--navy); color: #fff; }
.kit-name { font: 700 1.3rem/1.1 var(--font); font-stretch: 75%; }
.kit-desc { font-size: .9rem; color: var(--muted); }

<body>
<div id="app"></div>
<div id="announcer" class="sr" aria-live="polite"></div>
<script>
/* ================= 2. DATOS ================= */
/* =========================================================
   SportsLeague: datos y reglas de negocio compartidas.

   Cada colección corresponde a una tabla del documento de arquitectura:
     League DB ....... leagues, seasons, categories, rules
     Team DB ......... teams, players
     Fixture DB ...... matches
     Referee DB ...... referees (+ availability), assignments (referee_assignments)
     Live Score DB ... events (match_events)
     Analytics DB .... attendance (attendance_estimates), suspended (suspended_matches)
   accounts ......... cuentas de organizador. En el proyecto real el API Gateway valida
                      la contraseña (guardada solo como hash) y entrega JWT + refresh token.
   notifications .... avisos enviados por Notification Service.

   Las páginas comparten los datos guardándolos en localStorage (prototipo).
   ========================================================= */

const TODAY = '2026-09-26'; // fecha de referencia de los datos de ejemplo (sábado)
const DAY_KEYS = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
const DAY_LABELS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const SPORT = { futbol: 'Fútbol', basquet: 'Básquet', voley: 'Vóley' };
const TIEBREAK = { diferencia_de_goles: 'diferencia de goles', goles_a_favor: 'goles a favor' };
const ELIG = { elegible: 'Elegible', no_elegible: 'No elegible', pendiente: 'Pendiente' };
const STATUS = { programado: 'Programado', en_curso: 'En curso', finalizado: 'Finalizado', suspendido: 'Suspendido' };
const EVENT = { gol: 'Gol', amarilla: 'Tarjeta amarilla', roja: 'Tarjeta roja', sustitucion: 'Sustitución' };
const STORE_KEY = 'sportsleague-demo-v1';
const SESSION_KEY = 'sportsleague-sesion';

/* ---------- Utilidades ---------- */
const fmtLong = new Intl.DateTimeFormat('es-CO', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const fmtShort = new Intl.DateTimeFormat('es-CO', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function dateOnly(iso) { return String(iso).slice(0, 10); }
function asDate(iso) { return new Date(dateOnly(iso) + 'T00:00:00Z'); }
function longDate(iso) { return fmtLong.format(asDate(iso)); }
function shortDate(iso) { return fmtShort.format(asDate(iso)); }
function dayKey(iso) { return DAY_KEYS[asDate(iso).getUTCDay()]; }
function signed(n) { return n > 0 ? '+' + n : String(n); }
function ageAt(birth, at = TODAY) {
  const b = asDate(birth), d = asDate(at);
  let a = d.getUTCFullYear() - b.getUTCFullYear();
  const m = d.getUTCMonth() - b.getUTCMonth();
  if (m < 0 || (m === 0 && d.getUTCDate() < b.getUTCDate())) a--;
  return a;
}
function parseRange(r) { const [min, max] = String(r).split('-').map(Number); return { min, max }; }
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- Estado ---------- */
let DB = null, counters = {}, LIVE = null;
function emptyDB() {
  return { accounts: [], leagues: [], seasons: [], categories: [], rules: [], teams: [], players: [], matches: [],
           referees: [], assignments: [], events: [], attendance: [], suspended: [], notifications: [] };
}
function nextId(k) { counters[k] = (counters[k] || 0) + 1; return counters[k]; }
function byId(list, id) { return list.find((x) => x.id === id); }
function league(id) { return byId(DB.leagues, id); }
function season(id) { return byId(DB.seasons, id); }
function category(id) { return byId(DB.categories, id); }
function team(id) { return byId(DB.teams, id); }
function player(id) { return byId(DB.players, id); }
function match(id) { return byId(DB.matches, id); }
function ruleOf(catId) { return DB.rules.find((r) => r.categoryId === catId); }
function teamsOf(catId) { return DB.teams.filter((t) => t.categoryId === catId); }
function leagueOfMatch(m) { const s = season(m.seasonId); return s ? s.leagueId : null; }

/* =========================================================
   Reglas de negocio (las mismas de los microservicios)
   ========================================================= */
// Team Service: elegibilidad según el age_range de la categoría (consulta síncrona a League)
function eligibilityFor(categoryId, birthDate) {
  const c = category(categoryId);
  if (!c) return 'pendiente';
  const { min, max } = parseRange(c.ageRange), a = ageAt(birthDate);
  return a >= min && a <= max ? 'elegible' : 'no_elegible';
}
// Fixture Service: todos contra todos, localía equilibrada, canchas sin repetir en la jornada
function roundRobin(ids, venues, startISO, daysBetween) {
  const BYE = null, rot = ids.length % 2 === 0 ? [...ids] : [...ids, BYE], n = rot.length;
  const home = Object.fromEntries(ids.map((t) => [t, 0])), out = [];
  let cur = [...rot];
  for (let r = 0; r < n - 1; r++) {
    const d = asDate(startISO); d.setUTCDate(d.getUTCDate() + r * daysBetween);
    let v = r;
    for (let i = 0; i < n / 2; i++) {
      const a = cur[i], b = cur[n - 1 - i];
      if (a === BYE || b === BYE) continue;
      const bHome = home[b] < home[a] || (home[b] === home[a] && r % 2 === 1);
      const h = bHome ? b : a, w = bHome ? a : b;
      home[h]++;
      out.push({ round: r + 1, home: h, away: w, venue: venues[v++ % venues.length], date: d.toISOString() });
    }
    cur = [cur[0], cur[n - 1], ...cur.slice(1, n - 1)];
  }
  return out;
}
// Fixture Service: validaciones antes de generar (reglamento en League, equipos en Team)
function buildFixture(p) {
  const venues = p.venues.split(',').map((s) => s.trim()).filter(Boolean);
  const c = category(p.categoryId);
  if (!c) return { error: 'Elige una categoría.' };
  if (!ruleOf(p.categoryId)) return { error: `La categoría ${c.name} no tiene reglamento. Defínelo en Ligas y reglamento antes de generar el calendario.` };
  if (p.teamIds.length < 2) return { error: 'Elige al menos 2 equipos.' };
  if (!p.zone) return { error: 'Escribe la zona de las canchas. Con ella se asignan los árbitros.' };
  if (!venues.length) return { error: 'Escribe al menos una cancha.' };
  if (!p.startDate) return { error: 'Elige la fecha de la primera jornada.' };
  if (!(p.restDaysMin >= 1) || !(p.daysBetweenRounds >= 1)) return { error: 'El descanso mínimo y los días entre jornadas deben ser 1 o más.' };
  if (p.daysBetweenRounds < p.restDaysMin) return { error: `Las jornadas quedarían cada ${p.daysBetweenRounds} días y el descanso mínimo es de ${p.restDaysMin}. Aumenta los días entre jornadas.` };
  const per = Math.floor(p.teamIds.length / 2);
  if (per > venues.length) return { error: `Cada jornada tiene ${per} partidos y solo hay ${venues.length} ${venues.length === 1 ? 'cancha' : 'canchas'}. Agrega canchas para que ningún partido se cruce.` };
  const list = roundRobin(p.teamIds, venues, p.startDate, p.daysBetweenRounds);
  return { list, rounds: Math.max(...list.map((x) => x.round)) };
}
// Referee Service: al recibir fixture.published asigna por zona, categoría y día; uno por partido y jornada
function assignReferees(roundMatches, zone) {
  if (!roundMatches.length) return 0;
  const catId = team(roundMatches[0].homeTeam).categoryId, busy = new Set();
  const load = (id) => DB.assignments.filter((a) => a.refereeId === id).length;
  let created = 0;
  for (const m of roundMatches) {
    if (DB.assignments.some((a) => a.matchId === m.id)) continue;
    const day = dayKey(m.scheduledAt);
    const c = DB.referees.filter((r) => r.zone === zone && r.categoriesCertified.includes(catId) && r.availability.includes(day) && !busy.has(r.id))
      .sort((x, y) => load(x.id) - load(y.id) || x.id - y.id)[0];
    if (!c) continue;
    DB.assignments.push({ id: nextId('assignment'), matchId: m.id, refereeId: c.id, confirmed: false });
    busy.add(c.id); created++;
  }
  return created;
}
// Notification Service: horarios confirmados, cambios de sede y resultados finales
function notify(leagueId, date, kind, text) { DB.notifications.push({ id: nextId('note'), leagueId, date, kind, text }); }
// Live Score Service: evento registrado por el árbitro (match.event)
function addEvent(m, type, p, minute) { DB.events.push({ id: nextId('event'), matchId: m.id, type, playerId: p.id, minute, teamId: p.teamId }); }
function playerByJersey(teamId, jersey) {
  return DB.players.find((p) => p.teamId === teamId && p.jerseyNumber === jersey && p.eligibilityStatus === 'elegible')
    || DB.players.find((p) => p.teamId === teamId && p.jerseyNumber !== 1 && p.eligibilityStatus === 'elegible');
}
function resultText(m) { const [h, a] = scoreOf(m); return `Resultado final: ${team(m.homeTeam).name} ${h}–${a} ${team(m.awayTeam).name}`; }

/* =========================================================
   Consultas
   ========================================================= */
function leagueSeasons(lid) { return DB.seasons.filter((s) => s.leagueId === lid).sort((a, b) => a.year - b.year || a.id - b.id); }
function leagueCategories(lid) { return DB.categories.filter((c) => c.leagueId === lid); }
function leagueTeams(lid) { const ids = new Set(leagueCategories(lid).map((c) => c.id)); return DB.teams.filter((t) => ids.has(t.categoryId)); }
function leagueReferees(lid) { const ids = new Set(leagueCategories(lid).map((c) => c.id)); return DB.referees.filter((r) => r.categoriesCertified.some((c) => ids.has(c))); }
function leagueMatches(lid) { const ids = new Set(leagueSeasons(lid).map((s) => s.id)); return DB.matches.filter((m) => ids.has(m.seasonId)); }
function leagueNotes(lid) { return DB.notifications.filter((n) => n.leagueId === lid).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id); }
function defaultSeason(lid) {
  const ss = leagueSeasons(lid); if (!ss.length) return null;
  const withMatches = ss.filter((s) => DB.matches.some((m) => m.seasonId === s.id));
  const current = withMatches.find((s) => s.startDate <= TODAY && TODAY <= s.endDate);
  return (current || withMatches[withMatches.length - 1] || ss[ss.length - 1]).id;
}
function seasonMatches(sid) { return DB.matches.filter((m) => m.seasonId === sid).sort((a, b) => a.scheduledAt.localeCompare(b.scheduledAt) || a.id - b.id); }
function roundsOf(sid) {
  const groups = []; let last = null;
  seasonMatches(sid).forEach((m) => { const d = dateOnly(m.scheduledAt); if (d !== last) { groups.push([]); last = d; } groups[groups.length - 1].push(m); });
  return groups;
}
function roundNumber(m) { return roundsOf(m.seasonId).findIndex((g) => g.some((x) => x.id === m.id)) + 1; }
function seasonCategory(sid) { const m = DB.matches.find((x) => x.seasonId === sid); return m ? team(m.homeTeam).categoryId : null; }
function seasonTeams(sid) { const s = new Set(); seasonMatches(sid).forEach((m) => { s.add(m.homeTeam); s.add(m.awayTeam); }); return [...s]; }
function scoreOf(m) { let h = 0, a = 0; DB.events.forEach((e) => { if (e.matchId === m.id && e.type === 'gol') { if (e.teamId === m.homeTeam) h++; else a++; } }); return [h, a]; }
function currentRoundIndex(rounds) { const i = rounds.findIndex((g) => dateOnly(g[0].scheduledAt) >= TODAY); return i === -1 ? rounds.length - 1 : i; }
function assignmentOf(matchId) { return DB.assignments.find((a) => a.matchId === matchId); }

// Statistics Service: se recalcula con match.completed (solo partidos finalizados) y con el reglamento de League
function standings(sid) {
  const catId = seasonCategory(sid); if (!catId) return [];
  const rule = ruleOf(catId) || { pointsWin: 3, pointsDraw: 1, tiebreakerCriteria: 'diferencia_de_goles' };
  const rows = new Map(seasonTeams(sid).map((id) => [id, { teamId: id, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0 }]));
  seasonMatches(sid).filter((m) => m.status === 'finalizado').forEach((m) => {
    const [h, a] = scoreOf(m), H = rows.get(m.homeTeam), A = rows.get(m.awayTeam);
    H.gf += h; H.ga += a; A.gf += a; A.ga += h;
    if (h > a) { H.wins++; A.losses++; } else if (h < a) { A.wins++; H.losses++; } else { H.draws++; A.draws++; }
  });
  const list = [...rows.values()].map((r) => ({ ...r, played: r.wins + r.draws + r.losses, goalDifference: r.gf - r.ga, points: r.wins * rule.pointsWin + r.draws * rule.pointsDraw }));
  const tb = rule.tiebreakerCriteria === 'goles_a_favor' ? (x, y) => y.gf - x.gf : (x, y) => y.goalDifference - x.goalDifference;
  return list.sort((x, y) => y.points - x.points || tb(x, y) || team(x.teamId).name.localeCompare(team(y.teamId).name));
}
function finishedIds(sid) { return new Set(seasonMatches(sid).filter((m) => m.status === 'finalizado').map((m) => m.id)); }
function topScorers(sid) {
  const fin = finishedIds(sid), c = new Map();
  DB.events.forEach((e) => { if (e.type === 'gol' && fin.has(e.matchId)) c.set(e.playerId, (c.get(e.playerId) || 0) + 1); });
  return [...c].map(([playerId, goals]) => ({ playerId, goals })).sort((a, b) => b.goals - a.goals || a.playerId - b.playerId);
}
function disciplinary(sid) {
  const fin = finishedIds(sid), c = new Map();
  DB.events.forEach((e) => {
    if (!fin.has(e.matchId) || (e.type !== 'amarilla' && e.type !== 'roja')) return;
    const r = c.get(e.playerId) || { playerId: e.playerId, yellowCards: 0, redCards: 0 };
    if (e.type === 'amarilla') r.yellowCards++; else r.redCards++;
    c.set(e.playerId, r);
  });
  return [...c.values()].sort((a, b) => b.redCards - a.redCards || b.yellowCards - a.yellowCards || a.playerId - b.playerId);
}
// Analytics Service: evolución del rendimiento (puntos acumulados por jornada)
function performanceTrend(sid) {
  const rounds = roundsOf(sid), rule = ruleOf(seasonCategory(sid)) || { pointsWin: 3, pointsDraw: 1 };
  const lastPlayed = rounds.reduce((acc, g, i) => (g.some((m) => m.status === 'finalizado') ? i : acc), -1);
  return seasonTeams(sid).map((tid) => {
    let pts = 0; const series = [0];
    rounds.slice(0, lastPlayed + 1).forEach((g) => {
      g.forEach((m) => {
        if (m.status !== 'finalizado' || (m.homeTeam !== tid && m.awayTeam !== tid)) return;
        const [h, a] = scoreOf(m), mine = m.homeTeam === tid ? h : a, other = m.homeTeam === tid ? a : h;
        pts += mine > other ? rule.pointsWin : mine === other ? rule.pointsDraw : 0;
      });
      series.push(pts);
    });
    return { teamId: tid, series, points: pts };
  }).sort((a, b) => b.points - a.points);
}
function seasonKpis(sid) {
  const ms = seasonMatches(sid), played = ms.filter((m) => m.status === 'finalizado'), susp = ms.filter((m) => m.status === 'suspendido');
  const att = DB.attendance.filter((a) => played.some((m) => m.id === a.matchId));
  return { total: ms.length, played: played.length, suspended: susp,
           avgAttendance: att.length ? Math.round(att.reduce((s, a) => s + a.estimatedAttendance, 0) / att.length) : 0 };
}

/* =========================================================
   Partido en curso: el árbitro registra eventos desde su app (match.event);
   al minuto 90 se publica match.completed -> Statistics recalcula y Notification avisa
   ========================================================= */
function liveTick() {
  const m = LIVE && match(LIVE.matchId);
  if (!m || m.status !== 'en_curso') return null;
  LIVE.minute++;
  const out = { matchId: m.id, minute: LIVE.minute, changed: false, announce: null };
  LIVE.script.filter((s) => s.minute === LIVE.minute).forEach((s) => {
    const tid = s.side === 'home' ? m.homeTeam : m.awayTeam;
    addEvent(m, s.type, playerByJersey(tid, s.jersey), s.minute);
    if (s.type === 'gol') out.announce = `Gol de ${team(tid).name}, minuto ${s.minute}.`;
    out.changed = true;
  });
  if (LIVE.minute >= 90) {
    m.status = 'finalizado';
    DB.attendance.push({ matchId: m.id, estimatedAttendance: 140 });
    notify(leagueOfMatch(m), TODAY, 'resultado', resultText(m));
    out.announce = `${resultText(m)}. La tabla de posiciones se actualizó.`;
    out.changed = true;
  }
  save();
  return out;
}

/* =========================================================
   Persistencia y sesión (prototipo)
   ========================================================= */
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ DB, counters, LIVE })); } catch (e) { /* sin almacenamiento */ } }
function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const s = JSON.parse(raw); DB = s.DB; counters = s.counters; LIVE = s.LIVE; return; }
  } catch (e) { /* datos dañados: se vuelven a crear */ }
  seed(); save();
}
function clearDemoData() { try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(SESSION_KEY); } catch (e) { /* nada que borrar */ } }
function currentAccount() { try { return byId(DB.accounts, Number(localStorage.getItem(SESSION_KEY))) || null; } catch (e) { return null; } }
function signIn(accountId) { try { localStorage.setItem(SESSION_KEY, String(accountId)); } catch (e) { /* sin almacenamiento */ } }
function signOut() { try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* sin almacenamiento */ } }

/* =========================================================
   Datos de ejemplo (ficticios): Liga Municipal de Montería
   ========================================================= */
function seed() {
  DB = emptyDB(); counters = {};
  const R = rng(26092026), pick = (a) => a[Math.floor(R() * a.length)];

  DB.leagues.push({ id: nextId('league'), name: 'Liga Municipal de Montería', sport: 'futbol' });
  DB.accounts.push({ id: nextId('account'), name: 'Organizador de ejemplo', email: 'organizador@ligamonteria.co', leagueId: 1 });
  DB.seasons.push({ id: nextId('season'), leagueId: 1, year: 2026, startDate: '2026-08-01', endDate: '2026-11-28' });
  DB.seasons.push({ id: nextId('season'), leagueId: 1, year: 2027, startDate: '2027-02-06', endDate: '2027-06-26' });
  DB.categories.push({ id: nextId('category'), leagueId: 1, name: 'Sub-17', ageRange: '15-17' });
  DB.categories.push({ id: nextId('category'), leagueId: 1, name: 'Sub-15', ageRange: '13-15' });
  DB.rules.push({ id: nextId('rule'), categoryId: 1, pointsWin: 3, pointsDraw: 1, tiebreakerCriteria: 'diferencia_de_goles' });
  DB.rules.push({ id: nextId('rule'), categoryId: 2, pointsWin: 3, pointsDraw: 1, tiebreakerCriteria: 'diferencia_de_goles' });
  [['Halcones FC', 1], ['Tigres del Sinú', 1], ['Leones del Sur', 1], ['Águilas Doradas', 1], ['Real Montería', 1], ['Atlético Cereté', 1],
   ['Juventud Lorica', 1], ['Deportivo Sahagún', 1], ['Unión Ciénaga de Oro', 2], ['Racing Tierralta', 2], ['Independiente Planeta Rica', 2], ['Club Montelíbano', 2]]
    .forEach(([name, categoryId]) => DB.teams.push({ id: nextId('team'), name, categoryId }));

  DB.teams.forEach((t, ti) => {
    const { min, max } = parseRange(category(t.categoryId).ageRange);
    [1, 3, 4, 5, 7, 8, 9, 10, 11, 16].forEach((jersey, i) => {
      let age = min + Math.floor(R() * (max - min + 1));
      if (i === 9 && ti % 3 === 0) age = max + 2;
      const d = asDate(TODAY); d.setUTCFullYear(d.getUTCFullYear() - age); d.setUTCDate(d.getUTCDate() - 1 - Math.floor(R() * 340));
      const birthDate = d.toISOString().slice(0, 10);
      let status = eligibilityFor(t.categoryId, birthDate);
      if (ti === 2 && i === 8) status = 'pendiente'; // League no respondió al fichar: queda por verificar
      DB.players.push({ id: nextId('player'), teamId: t.id, birthDate, eligibilityStatus: status, jerseyNumber: jersey });
    });
  });

  [['monteria-norte', [1, 2], ['sabado', 'domingo']], ['monteria-norte', [1], ['sabado']], ['monteria-norte', [1, 2], ['sabado', 'domingo']],
   ['monteria-norte', [1], ['sabado', 'domingo']], ['monteria-sur', [1, 2], ['sabado']], ['monteria-norte', [2], ['domingo']]]
    .forEach(([zone, categoriesCertified, availability]) => DB.referees.push({ id: nextId('referee'), zone, categoriesCertified, availability }));

  // Temporada 2026, Sub-17: calendario generado con el algoritmo del Fixture Service
  const VENUES = ['Cancha Municipal 1', 'Cancha Municipal 2', 'Estadio 18 de Junio', 'Cancha La Granja'];
  const s1Teams = teamsOf(1).map((t) => t.id);
  roundRobin(s1Teams, VENUES, '2026-08-15', 7).forEach((g) => DB.matches.push({ id: nextId('match'), seasonId: 1, homeTeam: g.home, awayTeam: g.away, venue: g.venue, scheduledAt: g.date, status: 'programado' }));
  const S1 = roundsOf(1);
  S1.forEach((g, r) => { notify(1, '2026-08-10', 'calendario', `Jornada ${r + 1} publicada: ${g.length} partidos el ${longDate(g[0].scheduledAt)}`); assignReferees(g, 'monteria-norte'); });

  const strength = Object.fromEntries(s1Teams.map((id, i) => [id, [1.45, 1.3, 1.55, 1.05, 0.95, 0.9, 0.8, 0.7][i]]));
  const goals = (s) => { let g = 0; while (g < 5 && R() < s / (g + 1.6)) g++; return g; };
  const seedResult = (m) => {
    const used = new Set();
    const minute = (lo = 2, hi = 90) => { let x; do { x = lo + Math.floor(R() * (hi - lo + 1)); } while (used.has(x)); used.add(x); return x; };
    const someone = (tid) => pick(DB.players.filter((p) => p.teamId === tid && p.jerseyNumber !== 1 && p.eligibilityStatus === 'elegible'));
    const side = () => (R() < 0.5 ? m.homeTeam : m.awayTeam);
    for (let i = goals(strength[m.homeTeam]); i > 0; i--) addEvent(m, 'gol', someone(m.homeTeam), minute());
    for (let i = goals(strength[m.awayTeam]); i > 0; i--) addEvent(m, 'gol', someone(m.awayTeam), minute());
    for (let i = Math.floor(R() * 3); i > 0; i--) addEvent(m, 'amarilla', someone(side()), minute());
    if (R() < 0.12) addEvent(m, 'roja', someone(side()), minute(30, 90));
    for (let i = 1 + Math.floor(R() * 2); i > 0; i--) { const t = side(); addEvent(m, 'sustitucion', playerByJersey(t, 16), minute(46, 85)); }
  };
  let liveMatch = null;
  S1.forEach((g, r) => g.forEach((m, i) => {
    if (r < 6) m.status = 'finalizado';
    if (r === 4 && i === 2) m.status = 'suspendido';
    if (r === 6) m.status = ['finalizado', 'en_curso', 'programado', 'programado'][i];
    if (m.status === 'finalizado') {
      seedResult(m);
      DB.attendance.push({ matchId: m.id, estimatedAttendance: 60 + Math.floor(R() * 180) });
      notify(1, dateOnly(m.scheduledAt), 'resultado', resultText(m));
    }
    if (m.status === 'suspendido') DB.suspended.push({ matchId: m.id, reason: 'Lluvia: la cancha se inundó' });
    if (m.status === 'en_curso') liveMatch = m;
  }));
  DB.assignments.forEach((a) => { const m = match(a.matchId); a.confirmed = m.status !== 'programado' || m.id === S1[6][2].id; });
  const moved = S1[6][3]; moved.venue = 'Polideportivo Sur';
  notify(1, '2026-09-24', 'sede', `Cambio de sede: ${team(moved.homeTeam).name} contra ${team(moved.awayTeam).name} ahora se juega en Polideportivo Sur`);

  [['gol', 'home', 9, 23], ['gol', 'away', 10, 41], ['amarilla', 'away', 5, 52], ['sustitucion', 'home', 16, 56]]
    .forEach(([type, s, j, min]) => addEvent(liveMatch, type, playerByJersey(s === 'home' ? liveMatch.homeTeam : liveMatch.awayTeam, j), min));
  LIVE = { matchId: liveMatch.id, minute: 58,
    script: [{ minute: 63, type: 'amarilla', side: 'away', jersey: 4 }, { minute: 71, type: 'gol', side: 'home', jersey: 9 },
             { minute: 80, type: 'sustitucion', side: 'away', jersey: 16 }, { minute: 87, type: 'gol', side: 'home', jersey: 10 }] };
}

loadData();

</script>

  if (!w.length) return '?';

  return w[0].slice(0, 3).toUpperCase();
}

  if (!list.length) return `<p class="empty">Aún no hay tarjetas en partidos finalizados.</p>`;
  return `<div class="scroll"><table class="data"><thead><tr><th>Jugador</th><th class="num">Amarillas</th><th class="num">Rojas</th></tr></thead><tbody>
    ${list.map((d) => { const p = player(d.playerId); return `<tr><td><span class="team-cell">${crest(p.teamId, 26)}#${p.jerseyNumber}, ${esc(team(p.teamId).name)}</span></td><td class="num">${d.yellowCards}</td><td class="num">${d.redCards}</td></tr>`; }).join('')}
    </tbody></table></div>`;
}
function spark(series, max) {
  const n = Math.max(series.length - 1, 1);
  const pts = series.map((v, i) => `${((i / n) * 100).toFixed(1)},${(28 - (v / Math.max(max, 1)) * 26).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#0E7A55" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function kpis(sid) {
  const k = seasonKpis(sid);
  return `<div class="stats"><div class="stat"><b>${k.played} de ${k.total}</b><span>partidos jugados</span></div>
    <div class="stat"><b>${k.avgAttendance}</b><span>personas por partido en promedio (asistencia estimada)</span></div>
    <div class="stat"><b>${k.suspended.length}</b><span>${k.suspended.length === 1 ? 'partido suspendido' : 'partidos suspendidos'}</span></div></div>`;
}
function notesList(lid, n) {
  const KIND = { calendario: 'Horario confirmado', sede: 'Cambio de sede', resultado: 'Resultado final' };
  const list = leagueNotes(lid).slice(0, n);
  if (!list.length) return `<p class="empty">Todavía no se ha enviado ningún aviso.</p>`;
  return `<ul class="notes">${list.map((x) => `<li><span class="meta"><span class="kind">${KIND[x.kind]}</span><time datetime="${x.date}">${shortDate(x.date)}</time></span><span>${esc(x.text)}</span></li>`).join('')}</ul>`;
}
function seasonPick(key, sid) {
  return `<label class="fl">Temporada<select data-change="${key}">${leagueSeasons(LEAGUE.id).map((s) => `<option value="${s.id}"${s.id === sid ? ' selected' : ''}>${s.year}</option>`).join('')}</select></label>`;
}
function formMsg(name) {
  const f = ui.flash && ui.flash.form === name ? ui.flash : null;
  return `<p class="form-msg${f ? ' is-ok' : ''}" data-msg${f ? ' role="status" tabindex="-1"' : ''}>${f ? esc(f.text) : ''}</p>`;
}
function topFlash() { return ui.flash && ui.flash.form === 'top' ? `<div class="flash" role="status" tabindex="-1">${esc(ui.flash.text)}</div>` : ''; }
function emptyCard(title, text, href, label) { return `<div class="card"><h2>${title}</h2><p class="hint">${text}</p>${href ? `<div class="factions"><a class="btn btn-blue" href="${href}">${label}</a></div>` : ''}</div>`; }
function ok(text, form) { ui.flash = { text, form: form || 'top' }; save(); render(); const el = document.querySelector('.form-msg.is-ok, .flash'); if (el) el.focus(); }
function fail(f, text) { const p = f.querySelector('[data-msg]'); p.className = 'form-msg is-error'; p.setAttribute('role', 'alert'); p.textContent = text; }

/* =========================================================
   Inicio: la plantilla de camisetas
   ========================================================= */
function setupState() {
  const lid = LEAGUE.id, cats = leagueCategories(lid);
  return {
    ligas: leagueSeasons(lid).length > 0 && cats.some((c) => ruleOf(c.id)),
    equipos: cats.some((c) => teamsOf(c.id).length >= 2),
    arbitros: leagueReferees(lid).length > 0,
    calendario: leagueMatches(lid).length > 0,
  };
}
function kitStat(id) {
  const lid = LEAGUE.id, ms = leagueMatches(lid);
  switch (id) {
    case 'ligas': { const s = leagueSeasons(lid).length, c = leagueCategories(lid).length; return `${s} ${s === 1 ? 'temporada' : 'temporadas'}, ${c} ${c === 1 ? 'categoría' : 'categorías'}`; }
    case 'equipos': { const t = leagueTeams(lid), ids = new Set(t.map((x) => x.id)); return `${t.length} equipos, ${DB.players.filter((p) => ids.has(p.teamId)).length} jugadores`; }
    case 'arbitros': { const n = leagueReferees(lid).length; return `${n} ${n === 1 ? 'árbitro' : 'árbitros'}`; }
    case 'calendario': return ms.length ? `${ms.length} partidos` : 'Sin calendario';
    case 'partidos': { const live = ms.filter((m) => m.status === 'en_curso').length, fin = ms.filter((m) => m.status === 'finalizado').length; return live ? `${live} en curso, ${fin} finalizados` : `${fin} finalizados`; }
    case 'estadisticas': return ms.some((m) => m.status === 'finalizado') ? 'Al día con el último partido' : 'Aún sin partidos jugados';
    default: return 'Abrir el sitio de la liga';
  }
}
function viewInicio() {
  const st = setupState(), steps = ['ligas', 'equipos', 'arbitros', 'calendario'], done = steps.filter((s) => st[s]).length;
  const next = steps.find((s) => !st[s]);
  const first = ACCOUNT.name.trim().split(/\s+/)[0];
  const kits = SECTIONS.map((s, i) => {
    const badge = steps.includes(s.id) && done < steps.length ? (st[s.id] ? `<span class="badge done">${CHECK}Listo</span>` : s.id === next ? '<span class="badge next">Siguiente paso</span>' : '') : '';
    return `<a class="kit${s.id === 'publico' ? ' public' : ''}" href="#/${s.id}" style="--i:${i}"><span class="kit-top"><span class="kit-icon">${iconSvg(s.id)}</span>${badge}</span>
      <span class="kit-name">${s.label}</span><span class="kit-desc">${s.desc}</span><span class="kit-stat">${kitStat(s.id)}</span></a>`;
  }).join('');
  let html = `<section class="hello">${PITCH}<div class="wrap"><div><h1>Hola, ${esc(first)}</h1><p>${esc(LEAGUE.name)}, ${SPORT[LEAGUE.sport].toLowerCase()}.${done < steps.length ? ' En cuatro pasos tu liga queda lista para jugar.' : ''}</p></div>
      ${done < steps.length ? `<div class="progress" role="img" aria-label="${done} de ${steps.length} pasos listos"><div class="progress-bar">${steps.map((x) => `<span class="${st[x] ? 'on' : ''}"></span>`).join('')}</div><p><b>${done} de ${steps.length}</b> pasos para poner en marcha tu liga</p></div>` : ''}</div></section>
    <main class="page"><div class="wrap stack">${topFlash()}
      <section><div class="squad-title"><h2>Secciones</h2><p>Todo lo de tu liga, en un solo lugar.</p></div><div class="kits">${kits}</div></section>`;
  if (leagueMatches(LEAGUE.id).length) {
    const sid = ui.season;
    if (!seasonMatches(sid).length) {
      html += `<div class="toolbar">${seasonPick('season', sid)}</div>` + emptyCard(`La temporada ${season(sid).year} todavía no tiene calendario`, 'Genéralo para ver aquí la jornada, la tabla y los indicadores.', '#/calendario', 'Ir a Calendario');
    } else {
      const rounds = roundsOf(sid), ci = currentRoundIndex(rounds), cur = rounds[ci], d = cur[0].scheduledAt;
      html += `<section class="card"><div class="head"><div><h2>Jornada ${ci + 1} de ${rounds.length}</h2><p>${cap((dateOnly(d) === TODAY ? 'hoy, ' : '') + longDate(d))}</p></div>${seasonPick('season', sid)}</div>
          <div class="tiles">${cur.map((m) => tile(m, `#/partidos/${m.id}`)).join('')}</div></section>
        ${kpis(sid)}
        <div class="cols"><section class="card"><div class="head"><h2>Tabla de posiciones</h2><a href="#/estadisticas">Ver estadísticas</a></div>${standingsTable(sid, true)}</section>
          <section class="card"><h2>Avisos recientes</h2>${notesList(LEAGUE.id, 6)}</section></div>`;
    }
  }
  return html + `</div></main>`;
}

function actaTable(m) {

  if (!evs.length) return '<p class="empty">El acta no tiene eventos.</p>';
  return `<div class="scroll"><table class="data"><thead><tr><th class="num">Minuto</th><th>Evento</th><th>Equipo</th><th>Camiseta</th><th></th></tr></thead><tbody>
    ${evs.map((e) => ui.editEvent === e.id ? `<tr><td colspan="5"><form class="inline-form" data-form="eventFix" data-event="${e.id}" novalidate>
        <input type="number" name="minute" min="1" max="120" value="${e.minute}" aria-label="Minuto" style="width:90px" />
        <select name="type" aria-label="Evento">${typeOpts(e.type)}</select>
        <select name="side" aria-label="Equipo"><option value="home"${e.teamId === m.homeTeam ? ' selected' : ''}>${esc(team(m.homeTeam).name)}</option><option value="away"${e.teamId === m.awayTeam ? ' selected' : ''}>${esc(team(m.awayTeam).name)}</option></select>
        <input type="number" name="jersey" min="1" value="${player(e.playerId).jerseyNumber}" aria-label="Camiseta" style="width:90px" />
        <button class="btn btn-blue btn-sm" type="submit">Guardar corrección</button><button class="btn btn-sm" type="button" data-action="cancelEvent">Cancelar</button>
        <p class="form-msg" data-msg></p></form></td></tr>`
      : `<tr><td class="num pos">${e.minute}'</td><td><span style="display:inline-flex;align-items:center;gap:8px"><span class="ev ev-${e.type}" aria-hidden="true"></span>${EVENT[e.type]}</span></td>
         <td>${esc(team(e.teamId).name)}</td><td>#${player(e.playerId).jerseyNumber}</td><td><button class="linkish" data-action="editEvent" data-id="${e.id}">Corregir</button></td></tr>`).join('')}
  </tbody></table></div>`;
}

  } else if (sub === 'tabla') {
    body = `<section class="card"><h2>Tabla de posiciones</h2>${standingsTable(sid, false)}</section>
      <div class="cols"><section class="card"><h2>Tarjetas acumuladas</h2>${cardsTable(sid, 10)}</section><section class="card"><h2>Goleadores</h2>${scorersList(sid, 10)}</section></div>`;

/* =========================================================
   Enrutador
   ========================================================= */
function route() { const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean); return { name: p[0] || '', a: p[1], b: p[2] }; }
const PANEL = { inicio: viewInicio, ligas: viewLigas, equipos: viewEquipos, arbitros: viewArbitros, calendario: viewCalendario, partidos: viewPartidos, estadisticas: viewEstadisticas };
const TITLES = { registro: 'Crear cuenta', entrar: 'Iniciar sesión', inicio: 'Inicio', publico: 'Sitio público' };
function enter(r) { // estado inicial al entrar a una vista
  Object.assign(ui, { flash: null, editRule: null, availEdit: null, venueEdit: null, editEvent: null, gen: null });
  if (LEAGUE && r.name !== 'publico') {
    ui.season = defaultSeason(LEAGUE.id);
    const m = r.name === 'partidos' && r.a ? match(Number(r.a)) : null;
    if (m && leagueOfMatch(m) === LEAGUE.id) ui.season = m.seasonId;
  }
}
function render() {
  const r = route();
  ACCOUNT = currentAccount(); LEAGUE = ACCOUNT ? league(ACCOUNT.leagueId) : null;
  // Si la sesión cambió (por ejemplo, desde otra pestaña), se reinicia el estado de la vista
  const accId = ACCOUNT ? ACCOUNT.id : null;
  if (accId !== ui.accountId) { ui.accountId = accId; enter(r); }
  if (!r.name) { location.replace(ACCOUNT ? '#/inicio' : '#/registro'); return; }
  const app = document.getElementById('app');
  if (r.name === 'registro' || r.name === 'entrar') {
    if (ACCOUNT) { location.replace('#/inicio'); return; }
    app.innerHTML = viewAuth(r.name);
  } else if (r.name === 'publico') {
    app.innerHTML = viewPublico(r);
  } else {
    if (!ACCOUNT) { location.replace('#/entrar'); return; }
    if (!PANEL[r.name]) { location.replace('#/inicio'); return; }
    app.innerHTML = shell(r.name, PANEL[r.name](r));
  }
  document.title = `${TITLES[r.name] || (sec(r.name) ? sec(r.name).label : '')} · SportsLeague`;
}
window.addEventListener('hashchange', () => {
  const r = route(), key = r.name + '/' + (r.a || '') + '/' + (r.b || '');
  ACCOUNT = currentAccount(); LEAGUE = ACCOUNT ? league(ACCOUNT.leagueId) : null;
  if (key !== CURRENT) { CURRENT = key; enter(r); window.scrollTo(0, 0); }
  render();
});

/* ---------- Acciones, formularios y cambios ---------- */
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const ACTIONS = {
  logout() { signOut(); location.hash = '#/entrar'; },
  resetDemo() { if (!confirm('Se borrarán los cambios y la sesión, y se cargarán de nuevo los datos de ejemplo. ¿Continuar?')) return; clearDemoData(); loadData(); location.hash = '#/entrar'; render(); },
  demo() { signIn(1); location.hash = '#/inicio'; },
  editRule(el) { ui.editRule = Number(el.dataset.id); render(); const i = document.querySelector('[data-form="rule"] input'); if (i) i.focus(); },
  cancelRule() { ui.editRule = null; render(); },
  pickTeam(el) { ui.team = Number(el.dataset.id); render(); },
  verifyPlayer(el) { // PUT /players/{id}/eligibility
    const p = player(Number(el.dataset.id)), before = p.eligibilityStatus;
    p.eligibilityStatus = eligibilityFor(team(p.teamId).categoryId, p.birthDate);
    ok(`Jugador #${p.jerseyNumber} verificado: ${ELIG[p.eligibilityStatus].toLowerCase()}${before !== p.eligibilityStatus ? ` (antes estaba ${ELIG[before].toLowerCase()})` : ''}.`, 'player');
  },
  editAvail(el) { ui.availEdit = Number(el.dataset.id); render(); },
  cancelAvail() { ui.availEdit = null; render(); },
  editVenue(el) { ui.venueEdit = Number(el.dataset.id); render(); const i = document.querySelector('[data-form="venue"] input'); if (i) i.focus(); },
  cancelVenue() { ui.venueEdit = null; render(); },
  genPublish() { // POST /seasons/{id}/fixtures/generate -> fixture.published por jornada
    const g = ui.gen; if (!g || !g.preview || seasonMatches(g.seasonId).length) return;
    g.preview.list.forEach((x) => DB.matches.push({ id: nextId('match'), seasonId: g.seasonId, homeTeam: x.home, awayTeam: x.away, venue: x.venue, scheduledAt: x.date, status: 'programado' }));
    const rounds = roundsOf(g.seasonId); let assigned = 0;
    rounds.forEach((ms, i) => { assigned += assignReferees(ms, g.params.zone); notify(LEAGUE.id, TODAY, 'calendario', `Jornada ${i + 1} publicada: ${ms.length} partidos el ${longDate(ms[0].scheduledAt)}`); });
    const total = g.preview.list.length, missing = total - assigned;
    ui.gen = null;
    ok(`Calendario publicado: ${total} partidos en ${rounds.length} jornadas. ${missing ? `${assigned} partidos ya tienen árbitro; ${missing} quedaron sin árbitro porque no hay árbitros de esa zona y categoría disponibles ese día.` : 'Todos los partidos ya tienen árbitro asignado.'}`);
  },
  editEvent(el) { ui.editEvent = Number(el.dataset.id); render(); },
  cancelEvent() { ui.editEvent = null; render(); },
};
const FORMS = {
  signup(fd, f) {
    const name = String(fd.get('name')).trim(), email = String(fd.get('email')).trim().toLowerCase(), pass = String(fd.get('password')), pass2 = String(fd.get('password2'));
    const leagueName = String(fd.get('leagueName')).trim(), sport = String(fd.get('sport'));
    if (!name) return fail(f, 'Escribe tu nombre.');
    if (!EMAIL.test(email)) return fail(f, 'Escribe un correo válido, por ejemplo nombre@correo.com.');
    if (DB.accounts.some((a) => a.email === email)) return fail(f, 'Ya existe una cuenta con ese correo. Inicia sesión.');
    if (pass.length < 8) return fail(f, 'La contraseña debe tener al menos 8 caracteres.');
    if (pass !== pass2) return fail(f, 'Las contraseñas no coinciden.');
    if (!leagueName) return fail(f, 'Escribe el nombre de tu liga.');
    const lg = { id: nextId('league'), name: leagueName, sport }; DB.leagues.push(lg); // POST /leagues
    const acc = { id: nextId('account'), name, email, leagueId: lg.id }; DB.accounts.push(acc); // la contraseña la guarda el backend como hash
    save(); signIn(acc.id); location.hash = '#/inicio';
  },
  signin(fd, f) {
    const email = String(fd.get('email')).trim().toLowerCase(), pass = String(fd.get('password'));
    if (!email || !pass) return fail(f, 'Escribe tu correo y tu contraseña.');
    const acc = DB.accounts.find((a) => a.email === email);
    if (!acc) return fail(f, 'No hay una cuenta con ese correo. Revisa que esté bien escrito o crea una cuenta.');
    signIn(acc.id); location.hash = '#/inicio'; // prototipo: la contraseña la verifica el API Gateway
  },
  season(fd, f) { // POST /leagues/{id}/seasons
    const year = Number(fd.get('year')), start = String(fd.get('startDate')), end = String(fd.get('endDate'));
    if (!(year >= 2000)) return fail(f, 'Escribe un año válido, por ejemplo 2027.');
    if (!start || !end) return fail(f, 'Elige la fecha de inicio y la de fin.');
    if (start >= end) return fail(f, 'La fecha de inicio debe ser anterior a la de fin.');
    DB.seasons.push({ id: nextId('season'), leagueId: LEAGUE.id, year, startDate: start, endDate: end });
    if (!ui.season) ui.season = defaultSeason(LEAGUE.id);
    ok(`Temporada ${year} creada.`, 'season');
  },
  category(fd, f) { // POST /seasons/{id}/categories
    const name = String(fd.get('name')).trim(), ar = String(fd.get('ageRange')).trim();
    if (!name) return fail(f, 'Escribe el nombre de la categoría.');
    if (!/^\d{1,2}-\d{1,2}$/.test(ar)) return fail(f, 'Escribe el rango de edad como mínimo-máximo, por ejemplo 15-17.');
    const { min, max } = parseRange(ar);
    if (min > max) return fail(f, 'En el rango de edad, la edad mínima no puede ser mayor que la máxima.');
    const c = { id: nextId('category'), leagueId: LEAGUE.id, name, ageRange: ar }; DB.categories.push(c);
    ui.editRule = c.id;
    ok(`Categoría ${name} creada. Ahora define su reglamento.`, 'rule');
  },
  rule(fd, f) { // PUT /categories/{id}/rules
    const catId = Number(f.dataset.cat), pw = Number(fd.get('pointsWin')), pd = Number(fd.get('pointsDraw')), tb = String(fd.get('tiebreakerCriteria'));
    if (!Number.isInteger(pw) || pw < 0 || !Number.isInteger(pd) || pd < 0) return fail(f, 'Los puntos deben ser números enteros desde 0.');
    const r = ruleOf(catId);
    if (r) Object.assign(r, { pointsWin: pw, pointsDraw: pd, tiebreakerCriteria: tb });
    else DB.rules.push({ id: nextId('rule'), categoryId: catId, pointsWin: pw, pointsDraw: pd, tiebreakerCriteria: tb });
    ui.editRule = null;
    ok(`Reglamento de ${category(catId).name} guardado. Las tablas de posiciones ya usan estos puntos.`, 'rule');
  },
  team(fd, f) { // POST /teams
    const name = String(fd.get('name')).trim();
    if (!name) return fail(f, 'Escribe el nombre del equipo.');
    if (teamsOf(ui.category).some((t) => t.name.toLowerCase() === name.toLowerCase())) return fail(f, `Ya hay un equipo llamado ${name} en esta categoría.`);
    const t = { id: nextId('team'), name, categoryId: ui.category }; DB.teams.push(t); ui.team = t.id;
    ok(`${name} registrado en ${category(t.categoryId).name}.`, 'team');
  },
  player(fd, f) { // POST /teams/{id}/players
    const t = team(ui.team), bd = String(fd.get('birthDate')), j = Number(fd.get('jerseyNumber'));
    if (!bd) return fail(f, 'Elige la fecha de nacimiento.');
    if (!Number.isInteger(j) || j < 1) return fail(f, 'Escribe un número de camiseta desde 1.');
    const status = eligibilityFor(t.categoryId, bd), c = category(t.categoryId), { min, max } = parseRange(c.ageRange);
    DB.players.push({ id: nextId('player'), teamId: t.id, birthDate: bd, eligibilityStatus: status, jerseyNumber: j });
    ok(`Jugador #${j} fichado en ${t.name}: ${ELIG[status].toLowerCase()}. Tiene ${ageAt(bd)} años y ${c.name} admite de ${min} a ${max}.`, 'player');
  },
  referee(fd, f) { // POST /referees
    const zone = String(fd.get('zone')).trim(), cats = fd.getAll('categories').map(Number), days = fd.getAll('days');
    if (!zone) return fail(f, 'Escribe la zona del árbitro.');
    if (!cats.length) return fail(f, 'Elige al menos una categoría certificada.');
    if (!days.length) return fail(f, 'Elige al menos un día disponible.');
    const r = { id: nextId('referee'), zone, categoriesCertified: cats, availability: days }; DB.referees.push(r);
    ok(`Árbitro #${r.id} registrado. Recibirá partidos de las jornadas que se publiquen.`, 'referee');
  },
  avail(fd, f) { // PUT /referees/{id}/availability
    const days = fd.getAll('days'), r = byId(DB.referees, Number(f.dataset.ref));
    if (!days.length) return fail(f, 'Elige al menos un día disponible.');
    r.availability = days; ui.availEdit = null;
    ok(`Disponibilidad del árbitro #${r.id} actualizada.`);
  },
  venue(fd, f) { // PUT /matches/{id}/venue
    const m = match(Number(f.dataset.match)), v = String(fd.get('venue')).trim();
    if (!v) return fail(f, 'Escribe el nombre de la cancha.');
    if (v === m.venue) return fail(f, 'Esa ya es la cancha del partido.');
    m.venue = v; ui.venueEdit = null;
    const text = `${team(m.homeTeam).name} contra ${team(m.awayTeam).name} ahora se juega en ${v}`;
    notify(LEAGUE.id, TODAY, 'sede', `Cambio de sede: ${text}`);
    ok(`Sede cambiada y aviso enviado: ${text}.`);
  },
  genPreview(fd) {
    ui.gen.params = readGen(fd);
    const res = buildFixture(ui.gen.params);
    ui.gen.error = res.error || null; ui.gen.preview = res.error ? null : res;
    render();
    const target = document.querySelector('#gen-form .form-msg, .rounds');
    if (target) target.scrollIntoView({ block: 'nearest' });
  },
  eventFix(fd, f) { // corrección del acta -> recálculo idempotente
    const e = byId(DB.events, Number(f.dataset.event)), m = match(e.matchId);
    const minute = Number(fd.get('minute')), type = String(fd.get('type')), side = String(fd.get('side')), j = Number(fd.get('jersey'));
    if (!(minute >= 1 && minute <= 120)) return fail(f, 'El minuto debe estar entre 1 y 120.');
    const tid = side === 'home' ? m.homeTeam : m.awayTeam, p = DB.players.find((x) => x.teamId === tid && x.jerseyNumber === j);
    if (!p) return fail(f, `${team(tid).name} no tiene un jugador con la camiseta #${j}.`);
    Object.assign(e, { minute, type, teamId: tid, playerId: p.id }); ui.editEvent = null;
    ok('Acta corregida. El marcador, la tabla, los goleadores y las tarjetas se recalcularon.', 'eventFix');
  },
};
const CHANGES = {
  season(v) { Object.assign(ui, { season: Number(v), venueEdit: null, gen: null }); render(); },
  category(v) { ui.category = Number(v); ui.team = null; render(); },
  pubSeason(v) { ui.pubSeason = Number(v); render(); },
  genCategory(v) {
    ui.gen.params = { ...readGen(new FormData(document.getElementById('gen-form'))), categoryId: Number(v), teamIds: teamsOf(Number(v)).map((t) => t.id) };
    ui.gen.preview = null; ui.gen.error = null; render();
  },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]'); if (!el || !ACTIONS[el.dataset.action]) return;
  ui.flash = null; ACTIONS[el.dataset.action](el, e);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]'); if (!f || !FORMS[f.dataset.form]) return;
  e.preventDefault(); FORMS[f.dataset.form](new FormData(f), f);
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]'); if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el.value);
});
// Cerrar el menú de cuenta al hacer clic fuera
document.addEventListener('click', (e) => { document.querySelectorAll('details.menu[open]').forEach((d) => { if (!d.contains(e.target)) d.removeAttribute('open'); }); });

/* ---------- Partido en curso (match.event y match.completed) ---------- */
setInterval(() => {
  const r = liveTick(); if (!r) return;
  document.querySelectorAll(`[data-live-minute="${r.matchId}"]`).forEach((el) => { el.textContent = `${r.minute}'`; });
  if (r.announce) document.getElementById('announcer').textContent = r.announce;
  const name = route().name;
  // Solo se redibujan las vistas sin formularios, para no borrar lo que alguien esté escribiendo
  if (r.changed && ['inicio', 'partidos', 'estadisticas', 'publico'].includes(name) && ui.editEvent === null) render();
}, 2000);

/* ---------- Arranque ---------- */
(() => { const r = route(); ACCOUNT = currentAccount(); LEAGUE = ACCOUNT ? league(ACCOUNT.leagueId) : null; CURRENT = r.name + '/' + (r.a || '') + '/' + (r.b || ''); enter(r); render(); })();

</script>
</body>
</html>
